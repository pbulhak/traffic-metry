<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrafficMetry - Live Traffic Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER: Logo + Connection Status -->
    <header class="app-header">
        <h1>TrafficMetry</h1>
        <div class="connection-status" id="connectionStatus">
            <span class="status-indicator" id="statusIndicator"></span>
            <span class="status-text" id="statusText">Connecting...</span>
        </div>
    </header>

    <!-- FULLSCREEN TRAFFIC VISUALIZATION -->
    <main class="app-main">
        <div class="traffic-visualization" id="trafficVisualization">
            <!-- Vehicle sprites will be dynamically added here -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/websocket_client.js"></script>
    <script src="js/vehicle_renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
